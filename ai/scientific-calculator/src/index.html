<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles/classic.css" id="theme-stylesheet">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display"></div>
        <div class="keypad" id="keypad">
            <!-- 3x3 matrix for digits -->
            <div class="keypad-row">
                <button class="keypad-btn" data-key="7">7</button>
                <button class="keypad-btn" data-key="8">8</button>
                <button class="keypad-btn" data-key="9">9</button>
                <button class="keypad-btn" data-key="C">C</button>
            </div>
            <div class="keypad-row">
                <button class="keypad-btn" data-key="4">4</button>
                <button class="keypad-btn" data-key="5">5</button>
                <button class="keypad-btn" data-key="6">6</button>
                <button class="keypad-btn" data-key="C">C</button>
            </div>
            <div class="keypad-row">
                <button class="keypad-btn" data-key="1">1</button>
                <button class="keypad-btn" data-key="2">2</button>
                <button class="keypad-btn" data-key="3">3</button>
                <button class="keypad-btn" data-key="C">C</button>
            </div>
            <!-- Bottom row for 0, ., =, +, - and operators -->
            <div class="keypad-row">
                <button class="keypad-btn" data-key="0">0</button>
                <button class="keypad-btn" data-key=".">.</button>
                <button class="keypad-btn" data-key="=">=</button>
            </div>
            <div class="keypad-row">
                <button class="keypad-btn" data-key="+">+</button>
                <button class="keypad-btn" data-key="-">-</button>
                <button class="keypad-btn" data-key="*">&#215;</button>
                <button class="keypad-btn" data-key="/">&#247;</button>
            </div>
        </div>
        <div class="buttons" id="buttons-container">
            <!-- Buttons will be generated here -->
        </div>
        <hr style="margin: 16px 0;">
        <div class="memory-operations" style="display: flex; gap: 8px;">
            <div>
                <button id="memory-add">M+</button>
                <button id="memory-subtract">M-</button>
                <button id="memory-clear">MC</button>
            </div>
            <div>
                <button id="memory-recall">MR</button>
            </div>
        </div>
        <hr style="margin: 16px 0;">
        <div class="history">
            <button id="toggle-history">Toggle History</button>
            <div id="history-log" class="history-log"></div>
        </div>
        <hr style="margin: 16px 0;">
        <div class="theme-toggle">
            <button id="toggle-theme">Toggle Theme</button>
        </div>
        <hr style="margin: 16px 0;">
        <div class="degree-radian-toggle">
            <button id="toggle-mode">Degree/Radian</button>
        </div>
    </div>
    <script src="scripts/calculator.js"></script>
    <script src="scripts/keyboard.js"></script>
    <script src="scripts/themes.js"></script>
    <script src="scripts/sound.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="components/display.js"></script>
    <script src="components/history.js"></script>
    <script src="components/memory.js"></script>
    <script src="components/buttons.js"></script>
    <script>
        // Handle keypad button clicks to update display
        const display = document.getElementById('display');
        const keypad = document.getElementById('keypad');

        // Memory logic
        let memory = [];

        document.getElementById('memory-add').addEventListener('click', function() {
            let value = parseFloat(display.textContent);
            if (!isNaN(value)) {
                memory.push(value);
            }
        });

        document.getElementById('memory-subtract').addEventListener('click', function() {
            let value = parseFloat(display.textContent);
            if (!isNaN(value)) {
                memory.push(-value);
            }
        });

        document.getElementById('memory-clear').addEventListener('click', function() {
            memory = [];
        });

        document.getElementById('memory-recall').addEventListener('click', function() {
            if (memory.length > 0) {
                // Show the sum of all memory values (classic calculator behavior)
                display.textContent = memory.reduce((a, b) => a + b, 0);
            } else {
                display.textContent = '';
            }
        });

        keypad.addEventListener('click', function(e) {
            if (e.target.classList.contains('keypad-btn')) {
                const key = e.target.getAttribute('data-key');
                if (key === '=') {
                    try {
                        // Replace division and multiplication symbols for JS eval
                        let expr = display.textContent.replace(/÷/g, '/').replace(/×/g, '*');
                        // Evaluate and show result
                        display.textContent = eval(expr);
                    } catch {
                        display.textContent = 'Error';
                    }
                    return;
                }
                if (key === 'C') {
                    display.textContent = '';
                    return;
                }
                display.textContent += key;
            }
        });
    </script>
</body>
</html>

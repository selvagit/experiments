name: C Lint & Build

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make clang-format

    - name: Check code formatting (clang-format)
      run: |
        # Use null-separated filenames and run clang-format in dry-run mode
        # `-i` writes files, which conflicts with `--dry-run`/`-Werror` checks.
        find computing -type f \( -name "*.c" -o -name "*.h" \) -print0 | xargs -0 clang-format --dry-run -Werror

    - name: Build C projects
      run: |
        cd computing/makefile && make clean && make

    - name: Run executable
      run: |
        ./computing/makefile/test
